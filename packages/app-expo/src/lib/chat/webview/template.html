<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6efdd">
<title>ReadAny Chat</title>
<style>
  /* ── 主题变量(首帧默认 sepia;RN ready 后 setTheme 覆盖)── */
  :root {
    --bg: #f6efdd; --fg: #3f3a2e; --card: #fdfaf0; --card-fg: #3f3a2e;
    --muted: #eae2c9; --muted-fg: #8a8265; --border: #e2d7ba;
    --primary: #8a6d3b; --primary-fg: #ffffff;
    --destructive: #c94f4f; --emerald: #2e9e6b; --amber: #b07d2b; --blue: #3d6fc9;
    --muted-72: rgba(138,130,101,0.72); --muted-50: rgba(138,130,101,0.5); --card-50: rgba(253,250,240,0.5);
    --primary-05: rgba(138,109,59,0.05); --primary-08: rgba(138,109,59,0.08);
    --primary-14: rgba(138,109,59,0.14); --primary-15: rgba(138,109,59,0.15);
    --destructive-04: rgba(201,79,79,0.04); --destructive-05: rgba(201,79,79,0.05);
    --destructive-10: rgba(201,79,79,0.1); --destructive-35: rgba(201,79,79,0.35);
    --amber-10: rgba(176,125,43,0.1); --amber-30: rgba(176,125,43,0.3);
    --bottom-pad: 120px;
    /* 固定值(与 RN theme.ts 一致) */
    --fs-sm: 14px; --lh: 20px; --fs-xs: 12px; --lh-xs: 16px;
    --mono: "Menlo","Consolas","JetBrains Mono",monospace;
    --radius-md: 8px; --radius-lg: 10px; --radius-xl: 16px;
    --spinner-fg: rgba(61,111,201,0.9);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--fs-sm); line-height: var(--lh);
    -webkit-text-size-adjust: 100%;
    user-select: text; -webkit-user-select: text; -webkit-touch-callout: default;
  }

  #list {
    height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 16px; padding-bottom: var(--bottom-pad);
    display: flex; flex-direction: column; gap: 12px;
  }
  #list::-webkit-scrollbar { display: none; }

  /* ── 消息外壳 ── */
  .msg { flex-shrink: 0; }
  .msg-system { margin-top: 4px; }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-assistant { display: flex; flex-direction: column; gap: 4px; }

  /* 系统消息卡(会话上下文) */
  .system-card {
    border-left: 3px solid var(--primary); background: var(--muted-72);
    border-radius: var(--radius-md); padding: 9px 12px;
  }
  .system-label { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--primary); font-weight: 600; }
  .system-text { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--fg); opacity: 0.85; margin-top: 4px; }

  /* 用户气泡 */
  .user-bubble {
    max-width: 85%; background: var(--muted); border-radius: 20px;
    padding: 8px 12px; white-space: pre-wrap; word-break: break-word;
  }
  .quote-block {
    display: flex; align-items: center; gap: 6px;
    background: var(--primary-05); border: 0.5px solid var(--primary-15);
    border-radius: var(--radius-md); padding: 6px 8px; margin-bottom: 6px;
  }
  .quote-text-wrap { flex: 1; min-width: 0; }
  .quote-text {
    font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--fg); opacity: 0.8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .quote-source { font-size: 11px; line-height: 15px; color: var(--muted-fg); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quote-jump { color: var(--primary); font-size: 14px; padding: 2px 4px; flex-shrink: 0; }

  /* 助手区 */
  .assistant-body { display: flex; flex-direction: column; gap: 4px; }
  .part { flex-shrink: 0; }

  /* 折叠卡(reasoning / tool_call) */
  .collapsible { border: 0.5px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin: 2px 0; }
  .collapsible.tool-error { border-color: var(--destructive-35); background: var(--destructive-04); }
  .collapsible-header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; cursor: pointer; min-width: 0; }
  .collapsible-body { border-top: 0.5px solid var(--border); padding: 8px 10px; display: none; }
  .collapsible.open .collapsible-body { display: block; }
  .header-text { font-size: var(--fs-sm); font-weight: 500; color: var(--fg); flex-shrink: 0; }
  .header-sub { flex: 1; min-width: 0; font-size: var(--fs-xs); color: var(--muted-fg); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .token-badges { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted-fg); font-variant-numeric: tabular-nums; margin-right: 6px; flex-shrink: 0; }
  .token-badges .sum { font-weight: 600; }
  .chevron { color: var(--muted-fg); transition: transform 0.18s; flex-shrink: 0; font-size: 12px; }
  .collapsible.open .chevron { transform: rotate(180deg); }
  .error-badge { background: var(--destructive-10); color: var(--destructive); font-size: var(--fs-xs); border-radius: 4px; padding: 2px 6px; flex-shrink: 0; }

  /* 状态图标 */
  .status-pending, .status-running, .status-completed, .status-error { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex-shrink: 0; }
  .status-pending::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--muted-fg); }
  .status-running::before { content: ""; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--spinner-fg); border-left-color: transparent; animation: wv-spin 0.8s linear infinite; }
  @keyframes wv-spin { to { transform: rotate(360deg); } }
  .status-completed::before { content: "✓"; color: var(--emerald); font-size: 12px; font-weight: 700; }
  .status-error::before { content: "✕"; color: var(--destructive); font-size: 12px; font-weight: 700; }
  .pulsing-dot { width: 10px; height: 10px; border-radius: 5px; background: var(--primary); opacity: 0.6; animation: wv-pulse 1.4s ease-in-out infinite; flex-shrink: 0; }
  @keyframes wv-pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 0.25; } }

  /* 折叠体内容 */
  .reasoning-body-text { max-height: 300px; overflow-y: auto; white-space: pre-wrap; font-size: var(--fs-sm); line-height: 18px; color: var(--fg); opacity: 0.85; }
  .body-section { margin-bottom: 8px; }
  .body-section:last-child { margin-bottom: 0; }
  .section-title { font-size: var(--fs-xs); font-weight: 500; color: var(--muted-fg); margin-bottom: 4px; }
  .code-block { border: 0.5px solid var(--border); background: var(--card); border-radius: 6px; padding: 8px; font-family: var(--mono); font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--fg); word-break: break-all; white-space: pre-wrap; }
  .code-block .k { color: var(--muted-fg); }
  .tool-result { max-height: 200px; overflow-y: auto; }
  .error-block { background: var(--destructive-05); border: 0.5px solid var(--destructive-35); border-radius: 6px; padding: 8px; }
  .error-title { font-size: var(--fs-xs); font-weight: 500; color: var(--destructive); margin-bottom: 4px; }
  .error-text { font-size: var(--fs-xs); color: var(--destructive); line-height: 16px; }

  /* aborted 警示条 */
  .aborted {
    display: flex; gap: 8px; align-items: center; padding: 8px 12px; margin: 2px 0;
    border: 1px solid var(--amber-30); background: var(--amber-10); color: var(--amber);
    border-radius: var(--radius-md); font-size: var(--fs-sm);
  }
  .aborted::before { content: "⨯"; font-size: 14px; }

  /* 流式文本与 markdown */
  .markdown { word-break: break-word; }
  .markdown p { font-size: var(--fs-sm); line-height: var(--lh); margin: 0 0 8px; }
  .markdown h1,.markdown h2 { font-size: 17px; font-weight: 700; margin: 12px 0 8px; }
  .markdown h3,.markdown h4 { font-size: 15px; font-weight: 700; margin: 10px 0 6px; }
  .markdown h5,.markdown h6 { font-size: var(--fs-sm); font-weight: 700; margin: 8px 0 4px; }
  .markdown ul,.markdown ol { margin: 4px 0; padding-left: 20px; }
  .markdown li { margin: 3px 0; }
  .markdown blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--muted-fg); }
  .markdown table { border-collapse: collapse; margin: 8px 0; font-size: var(--fs-xs); width: 100%; }
  .markdown th,.markdown td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .markdown th { background: var(--muted); font-weight: 600; }
  .markdown pre { background: var(--muted); border-radius: var(--radius-md); padding: 12px; overflow-x: auto; margin: 6px 0; }
  .markdown pre code { font-family: var(--mono); font-size: 13px; color: var(--fg); background: transparent; padding: 0; }
  .markdown code { font-family: var(--mono); font-size: 13px; background: var(--muted); color: var(--fg); padding: 1px 5px; border-radius: 5px; }
  .markdown a { color: var(--blue); text-decoration: none; }
  .markdown img { max-width: 100%; border-radius: var(--radius-md); }
  .markdown hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .cite-link { color: var(--primary); font-size: 0.7em; vertical-align: super; font-weight: 600; margin: 0 1px; }
  .stream-cursor::after { content: ""; display: inline-block; width: 3px; height: 14px; background: var(--primary); margin-left: 2px; vertical-align: -2px; animation: wv-cursor 0.9s step-end infinite; }
  @keyframes wv-cursor { 50% { opacity: 0; } }

  /* 图表卡 */
  .chart-card { border: 0.5px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin: 2px 0; }
  .chart-card .chart-box { overflow: hidden; }
  .chart-hint { font-size: 11px; color: var(--muted-fg); padding: 6px 10px; border-top: 0.5px solid var(--border); }
  .chart-error { padding: 12px; font-size: var(--fs-xs); color: var(--destructive); }
  .chart-retry { margin-top: 8px; padding: 6px 14px; border-radius: 14px; background: var(--primary); color: var(--primary-fg); border: none; font-size: var(--fs-xs); }

  /* 状态指示器 pill(列表尾部/气泡 gap) */
  .step-pill {
    display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    background: var(--muted); color: var(--muted-fg);
    border-radius: 999px; padding: 6px 12px; font-size: var(--fs-xs);
  }
  .step-pill::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--primary); opacity: 0.5; animation: wv-pulse 1.2s ease-in-out infinite; }
  #footer-indicator { padding: 4px 0; display: none; }

  /* footer */
  .assistant-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .copy-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; color: var(--muted-fg); border: none; padding: 4px 8px;
    font-size: var(--fs-xs); border-radius: var(--radius-md);
  }
  .copy-btn:active { background: var(--muted); }
  .copy-btn.copied { color: var(--emerald); }
  .copy-btn .ic-copy::before { content: "⧉"; font-size: 13px; color: var(--muted-fg); }
  .copy-btn.copied .ic-copy::before { content: "✓"; color: var(--emerald); }
  .token-sum { font-size: var(--fs-xs); color: var(--muted-fg); font-variant-numeric: tabular-nums; margin-right: 8px; }

  /* 回底按钮 */
  #scroll-down-pill {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; display: none;
    background: var(--primary-14); color: var(--primary); border: 0.5px solid var(--primary-15);
    border-radius: 999px; padding: 8px 14px; font-size: 12px; z-index: 5;
  }
  #scroll-down-pill::before { content: "↓ "; }
</style>
</head>
<body>
  <!-- CDN 图库,仅消息含图表时由 bundle 按需注入(见 index.ts ensureChartLibs) -->
  <div id="list"></div>
  <div id="footer-indicator"></div>
  <div id="scroll-down-pill">滚动到底部</div>

  <script>
    // ── webview→RN 单出口 + RN→webview 命令入口黏合(照抄 reader.template.html 模式)──
    (function () {
      function postToRN(type, data) {
        if (!window.ReactNativeWebView) return;
        var msg = { type: type };
        for (var k in data) msg[k] = data[k];
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      }
      window.__postToRN = postToRN;
      window.__chat = { dispatch: null };
      var queue = [];
      function onCmd(e) {
        var cmd;
        try { cmd = JSON.parse(e.data); } catch (err) { postToRN("error", { message: String(err) }); return; }
        var d = window.__chat.dispatch;
        if (d) { try { d(cmd); } catch (err) { postToRN("error", { message: String((err && err.stack) || err) }); } }
        else queue.push(cmd);
      }
      window.__chat.flushQueue = function () {
        var q = queue.slice(); queue.length = 0;
        for (var i = 0; i < q.length; i++) window.__chat.dispatch(q[i]);
      };
      // Android:window 'message' 事件;iOS:document 'message' 事件(双保险,同 reader)
      window.addEventListener("message", onCmd);
      document.addEventListener("message", onCmd);
      postToRN("shell-ready", {});
    })();
  </script>

  <!-- __CHAT_BUNDLE_INSERT_9c2e1f__ -->
</body>
</html>
